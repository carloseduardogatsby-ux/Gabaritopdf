name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos do projeto
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html debug.keystore; do
            [ -f "$f" ] || { echo "::error::Arquivo ausente no repositorio: $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund || { echo "::error::Falhou no npm install"; exit 1; }
      - name: Copiar PDF.js para o app (funciona offline)
        run: |
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/ || { echo "::error::Falhou ao copiar pdf.min.js"; ls node_modules/pdfjs-dist/build | head -20; exit 1; }
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/ || { echo "::error::Falhou ao copiar pdf.worker.min.js"; exit 1; }
      - name: Criar projeto Android
        run: |
          npx cap add android || { echo "::error::Falhou no cap add android"; exit 1; }
          npx cap sync android || { echo "::error::Falhou no cap sync"; exit 1; }
      - name: Usar a mesma chave de assinatura
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || { echo "::error::Falhou no gradle assembleDebug"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Gabarito-Deck-PDF-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
